name: Package Unreal Engine Project

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted
    name: Package Unreal Engine Project
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Restore Local Plugins
        shell: powershell
        run: |
          $localPluginZipPath = "D:\UnrealProjects\TromboneRumble-Dependencies\Plugins.zip"
          $destinationPath = "${{ github.workspace }}"

          if (-not (Test-Path $localPluginZipPath)) {
            Write-Error "Local plugin cache file not found at '$localPluginZipPath'. Aborting."
            exit 1
          }

          Expand-Archive -Path $localPluginZipPath -DestinationPath $destinationPath -Force

      - name: Package Project
        env: 
          UE_PATH: 'D:\UE_5.5'
          PROJECT_PATH: '${{ github.workspace }}\TromboneRumble.uproject'
          OUTPUT_PATH: '${{ github.workspace }}\BuildOutput'
        shell: powershell
        run: |
          & $env:UE_PATH\Engine\Build\BatchFiles\RunUAT.bat BuildCookRun -project="$env:PROJECT_PATH" -noP4 -platform=Win64 -clientconfig=Development -serverconfig=Development -cook -allmaps -build -stage -pak -archive -archivedirectory="$env:OUTPUT_PATH" -buildargs="-NoLiveCoding"
      
      - name: Compress Packaged Folder with Date-Time
        run: |
          $compressPath = "D:\TromboneRumbleDrive\Build"
          $buildOutputPath = "${{ github.workspace }}\BuildOutput"
          $sourceFolder = Join-Path $buildOutputPath "Windows"
          
          if (-not (Test-Path $sourceFolder)) {
              Write-Error "Packaged folder '$sourceFolder' not found. Aborting compression."
              exit 1
          }

          $dateTime = Get-Date -Format "yyyyMMdd_HHmm"
          $zipFileName = "${dateTime}_${{ github.event.repository.name }}.zip"
          $destinationZipPath = Join-Path $compressPath $zipFileName

          Compress-Archive -Path $sourceFolder -DestinationPath $destinationZipPath -Force
