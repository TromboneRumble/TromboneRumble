name: Package Unreal Engine Project

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'Windows/**'
      - 'Build/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted
    name: Package Unreal Engine Game
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Package Project
        env: 
          UE_PATH: 'D:\UE_5.5'
          PROJECT_PATH: 'D:\UnrealProjects\TromboneRumble\TromboneRumble.uproject'
          OUTPUT_PATH: 'D:\UnrealProjects'
        run: |
          & $env:UE_PATH\Engine\Build\BatchFiles\RunUAT.bat BuildCookRun -project="$env:PROJECT_PATH" -noP4 -platform=Win64 -clientconfig=Development -serverconfig=Development -cook -allmaps -build -stage -pak -archive -archivedirectory="$env:OUTPUT_PATH" -NoLiveCoding
      - name: Rename Packaged Folder
        run: |
          Rename-Item -Path "D:\UnrealProjects\Windows" -NewName "${{ github.event.repository.name }}" -Force
        
      - name: Compress Renamed Folder with Date-Time
        run: |
          cd "D:\UnrealProjects"
          $dateTime = Get-Date -Format "yyyyMMdd_HHmm"
          $zipFileName = "${dateTime}_${{ github.event.repository.name }}.zip"
          
          if (Test-Path $zipFileName) { Remove-Item $zipFileName }
          
          Compress-Archive -Path "${{ github.event.repository.name }}" -DestinationPath $zipFileName
